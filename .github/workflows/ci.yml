# Checks every pull request, and main, on the four runtimes CHO supports.
name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# The tests of the NATS adapter run against a real server, with JetStream,
# on the three runtimes: tools/brokers.sh starts it in Docker. The ones of the
# Kafka adapter take longer, and have a job of their own, on Node.js.
env:
  NATS_URL: localhost:4222

jobs:
  deno:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno install
      - run: deno check .
      - run: deno lint
      - run: tools/brokers.sh start nats
      - run: deno task test
      - name: The questions of @chojs/prompt and of cho new, in a real terminal
        run: tools/pty.sh deno
      - name: Publish dry run
        run: deno publish --dry-run

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: deno install # installs the npm dependencies (hono, fastify) into node_modules
      - run: tools/brokers.sh start nats
      - run: npx --yes tsx --test
      - name: The questions of @chojs/prompt and of cho new, in a real terminal
        run: tools/pty.sh node
      - name: The npm package of the CLI
        run: |
          deno task --cwd cli npm
          node cli/npm/cho.js --help
          # a workspace, written by the file a user would get: every answer
          # is a flag, and nothing is installed
          folder=$(mktemp -d)
          (cd "$folder" && node "$GITHUB_WORKSPACE/cli/npm/cho.js" new shop \
            --kind web --runtime node --project api --apps-dir apps \
            --no-git --no-install)
          test -f "$folder/shop/cho.json"
          test -f "$folder/shop/.npmrc"
          test -f "$folder/shop/apps/api/main.ts"
          # a library, added to it from a folder of the workspace
          (cd "$folder/shop/apps/api" && node "$GITHUB_WORKSPACE/cli/npm/cho.js" \
            add shared --type library --no-install)
          test -f "$folder/shop/libs/shared/mod.ts"
          grep -q '"shared"' "$folder/shop/cho.json"
          # packs the package and lists its files, and asks npm nothing:
          # `npm publish --dry-run` fails when the version is already on npm,
          # which it is from a release to the next
          npm pack --dry-run ./cli/npm

  kafka:
    # The Kafka adapter against a real broker, on the runtime its client
    # library is written for.
    runs-on: ubuntu-latest
    env:
      KAFKA_BROKERS: localhost:9092
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: deno install
      - run: tools/brokers.sh start kafka
      - run: npx --yes tsx --test vendor/kafka/*_test.ts

  bun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: oven-sh/setup-bun@v2
      - run: deno install
      - run: tools/brokers.sh start nats
      - run: bun test
      - name: The questions of @chojs/prompt and of cho new, in a real terminal
        run: tools/pty.sh bun

  workerd:
    # Cloudflare Workers: each test file runs as a Worker, in workerd.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: deno install # hono, for the tests of its adapter
      - run: tools/workerd/run.sh # installs workerd and esbuild in a temporary folder
