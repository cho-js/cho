# Checks every pull request, and main, on the four runtimes CHO supports.
# The jobs run on Linux; `os` runs what depends on the system on macOS and on
# Windows.
name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# The tests of the NATS adapter run against a real server, with JetStream,
# on the three runtimes: tools/brokers.sh starts it in Docker. The ones of the
# Kafka adapter take longer, and have a job of their own, on Node.js.
env:
  NATS_URL: localhost:4222

jobs:
  deno:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno install
      - run: deno check .
      - run: deno lint
      - run: tools/brokers.sh start nats
      - run: deno task test
      - name: The questions of @chojs/prompt and of cho new, in a real terminal
        run: tools/pty.sh deno
      - name: Publish dry run
        run: deno publish --dry-run

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: deno install # installs the npm dependencies (hono, fastify) into node_modules
      - run: tools/brokers.sh start nats
      - run: npx --yes tsx --test
      - name: The questions of @chojs/prompt and of cho new, in a real terminal
        run: tools/pty.sh node
      - name: The npm package of the CLI
        run: tools/npm-cli.sh

  kafka:
    # The Kafka adapter against a real broker, on the runtime its client
    # library is written for.
    runs-on: ubuntu-latest
    env:
      KAFKA_BROKERS: localhost:9092
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: deno install
      - run: tools/brokers.sh start kafka
      - run: npx --yes tsx --test vendor/kafka/*_test.ts

  bun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: oven-sh/setup-bun@v2
      - run: deno install
      - run: tools/brokers.sh start nats
      - run: bun test
      - name: The questions of @chojs/prompt and of cho new, in a real terminal
        run: tools/pty.sh bun

  os:
    # macOS and Windows. The other jobs run on Linux, and say whether the code
    # is right. This one runs what talks to the system, where a system can
    # differ: the files and the programs of the CLI, and the servers and the
    # sockets of @chojs/web/serve, on the three runtimes. No broker runs here:
    # these machines have no Docker.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash # on Windows too: the one of Git
    steps:
      - name: Keep the line endings of the repository
        # on Windows, git would write the files with CRLF: the templates of
        # the CLI are compared with what was generated from them
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
      - run: deno install
      # each runtime is run, also when the one before it failed
      - name: Deno
        run: deno task test cli web/serve_test.ts web/socket-serve_test.ts
      - name: Node.js
        if: ${{ !cancelled() }}
        run: npx --yes tsx --test "cli/**/*_test.ts" web/serve_test.ts web/socket-serve_test.ts
      - name: Bun
        if: ${{ !cancelled() }}
        run: bun test ./cli ./web/serve_test.ts ./web/socket-serve_test.ts
      - name: The npm package of the CLI
        if: ${{ !cancelled() }}
        run: tools/npm-cli.sh
      - name: The questions of @chojs/prompt and of cho new, in a real terminal
        # script(1) makes the terminal: Windows has none
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        run: tools/pty.sh

  workerd:
    # Cloudflare Workers: each test file runs as a Worker, in workerd.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: deno install # hono, for the tests of its adapter
      - run: tools/workerd/run.sh # installs workerd and esbuild in a temporary folder
