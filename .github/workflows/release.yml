# Releases on merge to main, with release-please:
#
# 1. Every push to main updates a release pull request, built from the
#    conventional commits since the last release: version bumps in each
#    package's deno.json, and CHANGELOG.md entries.
# 2. Merging that pull request tags a GitHub release per package
#    (core-v3.0.0, command-v3.0.0, ...), then publishes to JSR.
#
# `deno publish` from the workspace root publishes every package whose version
# is not on JSR yet, and skips the others.
#
# The CLI is published a second time, to npm: `npm install --global` needs a
# JavaScript package with a `bin` entry, which JSR does not make. `cli/npm.ts`
# builds it. npm takes the identity of this workflow (trusted publishing, with
# the same `id-token` permission as JSR): there is no npm token, and none is
# read. The package names this repository and this file as its trusted
# publisher, on npmjs.com. A version that is already on npm is skipped, as on
# JSR.
#
# On npm the version is staged, not published: `npm stage publish` sends it to
# npm, where it waits. A maintainer approves it, with a second factor, and only
# then it is public:
#
#     npm stage list @chojs/cli
#     npm stage approve <stage-id>
#
# or on npmjs.com, in "Staged Packages" of the package. So a release is not
# done when this workflow is green: the approval is a step by hand.
name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # JSR and npm authenticate GitHub Actions with OIDC
    steps:
      - uses: actions/checkout@v7

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install
        run: deno install

      - name: Check
        run: |
          deno check .
          deno lint
          deno task test

      - name: Publish to JSR
        run: deno publish

      - uses: actions/setup-node@v7
        with:
          node-version: "24" # `npm stage` needs npm 11.15.0 or later
          registry-url: https://registry.npmjs.org
          package-manager-cache: false # no cache in a release

      - name: Build the npm package of the CLI
        run: deno task --cwd cli npm

      # No token: `npm stage publish` authenticates with the OIDC identity of
      # this workflow. `npm view` reads a public package, and needs none.
      #
      # The command packs the folder it runs in. A version that is published is
      # skipped. A version that already waits for an approval is not seen by
      # `npm view`, and npm refuses to stage it twice: when this step runs
      # again for it, it fails, and there is nothing to do but approve it.
      - name: Stage the CLI on npm
        working-directory: cli/npm
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "@chojs/cli@$version" version > /dev/null 2>&1; then
            echo "@chojs/cli@$version is already on npm"
          else
            npm stage publish --access public --provenance
            echo "@chojs/cli@$version is staged: approve it with npm stage approve"
          fi
