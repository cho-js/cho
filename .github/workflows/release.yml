# Releases on merge to main, with release-please:
#
# 1. Every push to main updates a release pull request, built from the
#    conventional commits since the last release: version bumps in each
#    package's deno.json, and CHANGELOG.md entries.
# 2. Merging that pull request tags a GitHub release per package
#    (core-v3.0.0, command-v3.0.0, ...), then publishes to JSR.
#
# `deno publish` from the workspace root publishes every package whose version
# is not on JSR yet, and skips the others.
#
# The CLI is published a second time, to npm: `npm install --global` needs a
# JavaScript package with a `bin` entry, which JSR does not make. `cli/npm.ts`
# builds it. npm takes the identity of this workflow (trusted publishing, with
# the same `id-token` permission as JSR), or the NPM_TOKEN secret when there is
# one. A version that is already on npm is skipped, as on JSR.
name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # JSR authenticates GitHub Actions with OIDC
    steps:
      - uses: actions/checkout@v7

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install
        run: deno install

      - name: Check
        run: |
          deno check .
          deno lint
          deno task test

      - name: Publish to JSR
        run: deno publish

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      - name: Publish the CLI to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          deno task --cwd cli npm
          version=$(node -p "require('./cli/npm/package.json').version")
          if npm view "@chojs/cli@$version" version > /dev/null 2>&1; then
            echo "@chojs/cli@$version is already on npm"
          else
            npm publish ./cli/npm
          fi
